version: '3.8'

services:
  wall-demo:
    # 从 GitHub Container Registry (GHCR) 拉取最新镜像
    # 镜像需先通过 CI 发布 (ghcr.io/yrighc/fuck-u-wall:latest)
    image: ghcr.io/yrighc/fuck-u-wall:latest
    # 本地构建模式（开发用）：先 `docker build -t wall-demo:0.0.1 .`，
    # 再把上面 image 改为 wall-demo:0.0.1 并取消下面的 build 注释
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "127.0.0.1:10003:8080"
    environment:
      - PORT=${PORT:-8080}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - TOTP_SECRET=${TOTP_SECRET:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}
      - SUBDOMAIN=${SUBDOMAIN}
      - MAX_FAILED_ATTEMPTS=${MAX_FAILED_ATTEMPTS:-5}
      - LOCKOUT_MINUTES=${LOCKOUT_MINUTES:-15}
      - TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-}
      - HOST=${HOST:-0.0.0.0}
    restart: unless-stopped
    # 如果需要使用 .env 文件，取消下面的注释
    # env_file:
    #   - .env