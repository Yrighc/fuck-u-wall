<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>WALL — IP WHITELIST</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>IP White-list</h1>
            <p>Access Control</p>
        </div>

        <form id="whitelistForm" class="content">
            <div class="field-group">
                <div class="label-row">
                    <label for="ipInput">Target IPv4/IPv6 Address</label>
                    <label class="label-dim" aria-hidden="true">Required</label>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="ipInput" name="ipInput" placeholder="0.0.0.0"
                           value="{{ client_ip if client_ip else '' }}"
                           autocomplete="off" spellcheck="false" required>
                </div>
            </div>

            <div class="field-group">
                <div class="label-row">
                    <label for="totp-1">Verification Code</label>
                </div>
                <div class="totp-container">
                    <div class="input-wrapper"><input type="text" inputmode="numeric" maxlength="1" class="totp-input" id="totp-1" placeholder="0" autocomplete="one-time-code"></div>
                    <div class="input-wrapper"><input type="text" inputmode="numeric" maxlength="1" class="totp-input" placeholder="0"></div>
                    <div class="input-wrapper"><input type="text" inputmode="numeric" maxlength="1" class="totp-input" placeholder="0"></div>
                    <div class="input-wrapper"><input type="text" inputmode="numeric" maxlength="1" class="totp-input" placeholder="0"></div>
                    <div class="input-wrapper"><input type="text" inputmode="numeric" maxlength="1" class="totp-input" placeholder="0"></div>
                    <div class="input-wrapper"><input type="text" inputmode="numeric" maxlength="1" class="totp-input" placeholder="0"></div>
                </div>
                <!-- 6 格输入同步到此隐藏字段，app.js 读取它（保持原有 JS 契约） -->
                <input type="hidden" id="totpCode" name="totpCode">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" data-text="AUTHORIZE ACCESS">
                <span id="btnText">AUTHORIZE ACCESS</span>
            </button>

            <div class="turnstile-area">
                <!-- Turnstile 人机验证：显式渲染，app.js 保留 widgetId 以便重置 -->
                <div id="turnstile-widget"
                     data-sitekey="{{ turnstile_sitekey }}"
                     data-action="whitelist"></div>
            </div>

            <div class="status-area">
                <div class="status-dot" aria-hidden="true"></div>
                <div class="status-text message" id="message">System Awaiting Input...</div>
            </div>
        </form>

        <div class="footer">
            <div class="footer-item">
                <div class="footer-icon" aria-hidden="true"></div>
                <span>Encrypted Session</span>
            </div>
            <div class="footer-item">
                <div class="footer-icon footer-icon-diamond" aria-hidden="true"></div>
                <span>Global Edge</span>
            </div>
            <div class="footer-item">
                <span id="statusClock">00:00:00</span>
            </div>
        </div>
    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
